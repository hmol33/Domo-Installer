version: 1
# Gource configuration for Domo-Installer
# Generated by Corneel (Hermes agent) for fleet Gource compatibility

repository:
  name: Domo-Installer
  owner: hmol33
  description: "Home Assistant Domoticz installer script"
  language: shell

source:
  paths:
    - "Domo-Installer.sh"
  exclude:
    - ".git"
    - "node_modules"
    - ".github"

visualization:
  title: "Domo-Installer development timeline"
  background: "#1a1a2e"
  font-size: 14
  auto-skip-seconds: 1
  seconds-per-day: 0.5
  file-extensions: true
  highlight-dirs: true
  highlight-users: true
  mode: directory
  color-images: false
  crop: vertical
  padding: 1.2

gource:
  auto-skip-seconds: 1
  seconds-per-day: 0.5
  hide-users: false
  hide-filenames: false
  hide-tree: false
  hide-progress: false
  hide-bloom: false
  hide-mouse: false
  hide-date: false
  hide-keyboard: false
  hide-files: false
  hide-dirnames: false
  hide-timestamp: false
  highlight-dirs: true
  highlight-users: true
  file-extensions: true
  file-idle-time: 0
  file-idle-time-at-end: 0
  max-files: 0
  max-file-lag: 0.1
  user-friction: 0.67
  user-scale: 1.0
  camera-mode: overview
  title: "Domo-Installer development timeline"

ffmpeg:
  framerate: 60
  resolution: 1920x1080
  codec: libx264
  preset: slow
  crf: 18
  pixel-format: yuv420p
  audio-codec: aac
  audio-bitrate: 192k
  movflags: +faststart
